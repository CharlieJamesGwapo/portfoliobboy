    <!--
      Boot styles, inlined so they apply before the stylesheet has been
      fetched. Without them the first paint is the browser's default white,
      which flashes hard against a dark site on a slow connection.

      This is deliberately *not* a splash overlay. Covering the hero would push
      the Largest Contentful Paint out to whenever the overlay is removed, so
      the page would score worse for the sake of looking busier. Instead the
      page background is correct from the first frame and an empty #root carries
      a quiet block of the hero's real palette until React mounts.
    -->
    <style>
      html { background: #0b2528; color-scheme: dark; }
      body { margin: 0; background: #0b2528; }
      #root:empty {
        /* Keep the decorative marker's margin inside the empty root so its
           removal cannot move the document when React mounts. */
        display: flow-root;
        min-height: 100svh;
        background:
          radial-gradient(circle at 78% 26%, rgba(103, 224, 193, 0.09), transparent 42%),
          #0b2528;
      }
      #root:empty::before {
        display: block;
        width: min(1180px, calc(100% - 48px));
        height: 2px;
        margin: 168px auto 0;
        background: #67e0c1;
        opacity: 0.24;
        content: '';
      }
    </style>
