name: Portfolio health

on:
  schedule:
    # GitHub scheduling is best effort; offset from the busy top of the hour.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: Send one clearly labelled email setup test
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: portfolio-health
  cancel-in-progress: false

jobs:
  health:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check fixed public portfolio and record independent results
        id: monitor
        continue-on-error: true
        run: node scripts/monitor_portfolio_health.mjs
        env:
          POSTHOG_PROJECT_KEY: ${{ secrets.PORTFOLIO_MONITOR_POSTHOG_KEY }}
          POSTHOG_API_HOST: https://us.i.posthog.com
      - name: Email fixed recipient when availability monitoring needs attention
        if: steps.monitor.outcome == 'failure'
        run: node scripts/send_portfolio_health_alert.mjs
        env:
          PORTFOLIO_MONITOR_RESEND_KEY: ${{ secrets.PORTFOLIO_MONITOR_RESEND_KEY }}
      - name: Send explicitly requested email setup test
        if: github.event_name == 'workflow_dispatch' && inputs.test_email
        run: node scripts/send_portfolio_health_alert.mjs --setup
        env:
          PORTFOLIO_MONITOR_RESEND_KEY: ${{ secrets.PORTFOLIO_MONITOR_RESEND_KEY }}
      - name: Preserve failed availability monitor status
        if: always() && steps.monitor.outcome == 'failure'
        run: exit 1
